---
###############################################################################
# Internal settings of the role (Debian 13 "trixie"): partition layout, pool
# and dataset construction, paths. User settings live in defaults/main.yml.
####### Nothing Below Here Needs to be Edited ############
###############################################################################

# Debian release to install (debootstrap suite and apt sources)
distro_release: "trixie"

###############################################################################
# [ Partitions ]###############################################################
# Partition numbers on every disk
boot_partition: "1"
swap_partition: "2"
root_partition: "3"
lvm_partition: "4"

# Define EFI System Partition (ESP) Size in MB
boot_partition_size_mb: "512"

# EFI system partition (EF00) with the "legacy BIOS bootable" attribute (bit 2),
# so syslinux can boot from it on legacy BIOS systems
uefi_partition_flags: "-a1 -n{{ boot_partition }}:1M:+{{ boot_partition_size_mb }}M -A{{ boot_partition }}:set:2 -t{{ boot_partition }}:EF00"

# Swap partition size per device: 1-2 devices use the single/mirror size, 3+ the raidz size
swap_partition_size_mb: "{{ (disk_by_id | length | int > 2) | ternary(raidz_swap_partition_size_mb, single_or_mirror_swap_partition_size_mb) }}"

# Swap partition flags: Linux swap (8200) on a single device, Linux RAID (FD00) when
# the swap partitions are joined into an mdadm array
swap_partition_flags: "-n{{ swap_partition }}:0:+{{ swap_partition_size_mb }}M -t{{ swap_partition }}:{{ (disk_by_id | length | int > 1) | ternary('FD00', '8200') }}"

# mdadm array used for swap on multi-device installs
swap_dev_name: "/dev/md/swap"

# Block device holding swap: the swap partition (single device) or the mdadm array
swap_device: "{{ (disk_by_id | length | int > 1) | ternary(swap_dev_name, disk_by_id[0] ~ '-part' ~ swap_partition) }}"

# Root pool partition flags, the partition type is appended in 05_create_partitions.yml
root_partition_flags: "-n{{ root_partition }}:0:{{ root_partition_size }} -t{{ root_partition }}"

# Suffix of the root partition in /dev/disk/by-id (or by-path) names
root_partition_name_suffix: "-part{{ root_partition }}"

# LVM partition flags: Linux LVM (8e00) or Linux LUKS (8309) on 1-2 devices,
# Linux RAID (FD00) for the mdadm raid5 on 3+ devices
single_disk_or_mirror_lvm_partition_type: "{{ (disk_encryption_type == 'none') | ternary('8e00', '8309') }}"
single_disk_or_mirror_lvm_flags: "-n{{ lvm_partition }}:0:{{ single_or_mirror_lvm_partition_size }} -t{{ lvm_partition }}:{{ single_disk_or_mirror_lvm_partition_type }}"
raidz_multi_disk_lvm_flags: "-n{{ lvm_partition }}:0:{{ raidz_lvm_partition_size }} -t{{ lvm_partition }}:FD00"

# mdadm array used for LVM on multi-device installs
lvm_dev_name: "/dev/md/lvm"

# Block device holding the LVM PV (or its LUKS container): the LVM partition or the mdadm array
lvm_device: "{{ (disk_by_id | length | int > 1) | ternary(lvm_dev_name, disk_by_id[0] ~ '-part' ~ lvm_partition) }}"

###############################################################################
# [ Root Pool and Datasets ]###################################################
# Root pool type based on the number of devices ("", "mirror", "raidz", etc.)
root_pool_type: "{{ set_root_pool_type[(disk_by_id | length)] | default(set_root_pool_type['default']) }}"

# "zpool create" options (pool name and vdevs are appended)
root_pool_options:
  - "-o ashift={{ zfs_rpool_ashift }}"
  - "-o autotrim=on"
  - "-O acltype=posixacl"
  - "-O canmount=off"
  - "-O compression={{ zfs_compression }}"
  - "-O atime=off"
  - "-O dnodesize=auto"
  - "-O normalization=formD"
  - "-O relatime=on"
  - "-O xattr=sa"
  - "-O mountpoint=/"
  - "-R {{ live_cd_mountpoint }}"

# Keyfile holding the passphrase for ZFS native encryption. It is created on the
# live system before the pool is created, copied into the new system and embedded
# in its initramfs, so the passphrase is only entered once (in ZFSBootMenu).
zfs_native_keyfile: "/etc/zfs/{{ root_pool_name }}.key"

# ZFS native encryption is set on the pool's root dataset: every dataset of the
# pool inherits it and shares one encryption root.
root_pool_encryption_options:
  - "-O encryption=aes-256-gcm"
  - "-O keyformat=passphrase"
  - "-O keylocation=file://{{ zfs_native_keyfile }}"

# All "zpool create" options, including encryption for "native"
root_pool_create_options: "{{ (root_pool_options + ((disk_encryption_type == 'native') | ternary(root_pool_encryption_options, []))) | join(' ') }}"

# Device-mapper names of the LUKS containers holding the root pool (one per disk).
# ':' (found in /dev/disk/by-path names) is not safe in device-mapper names.
luks_root_mapper_names: "{{ disk_by_id | map('basename') | map('regex_replace', ':', '_') | map('regex_replace', '^', 'crypt_') | map('regex_replace', '$', '_root') | list }}"

# Block devices the root pool is built from: LUKS mappers or the raw root partitions
root_pool_devices: "{{ (disk_encryption_type == 'luks')
  | ternary(['/dev/mapper/'] | product(luks_root_mapper_names) | map('join') | list,
            disk_by_id | product([root_partition_name_suffix]) | map('join') | list) }}"

# Complete "zpool create" arguments for a single-vdev pool
root_pool_create_params:
  "{{ root_pool_create_options }} {{ root_pool_name }} {{ root_pool_type }} {{ root_pool_devices | join(' ') }}"

# Container dataset for boot environments (<pool>/ROOT)
root_pool_container_options:
  - "-o canmount=off"
  - "-o mountpoint=none"
  - "{{ root_pool_name }}/ROOT"

# Root dataset (boot environment) of the new system
root_pool_dataset_path: "{{ root_pool_name }}/ROOT/{{ root_dataset_name }}"
root_dataset_options:
  - "-o mountpoint=/"
  - "-o canmount=noauto"

root_pool_home_dataset_path: "{{ root_pool_name }}/ROOT/home"

# Additional datasets ("zfs create" arguments)
datasets_to_create:
  - "{{ root_pool_dataset_path }}/srv"
  - "-o canmount=off {{ root_pool_dataset_path }}/usr"
  - "{{ root_pool_dataset_path }}/usr/local"
  - "-o canmount=off {{ root_pool_dataset_path }}/var"
  - "-o com.sun:auto-snapshot=false {{ root_pool_dataset_path }}/var/cache"
  - "-o canmount=off {{ root_pool_dataset_path }}/var/lib"
  - "{{ root_pool_dataset_path }}/var/log"
  - "{{ root_pool_dataset_path }}/var/mail"
  - "{{ root_pool_dataset_path }}/var/spool"
  - "-o com.sun:auto-snapshot=false {{ root_pool_dataset_path }}/var/tmp"
  - "{{ root_pool_dataset_path }}/var/www"
  # Home Directory Dataset will be kept outside of OS Dataset
  - "-o canmount=on -o mountpoint=/home -o compression={{ zfs_compression }} -o atime=off {{ root_pool_home_dataset_path }}"
  - "-o canmount=on -o mountpoint=/root {{ root_pool_home_dataset_path }}/root"
  # PVE specific datasets:
  - "{{ root_pool_dataset_path }}/var/lib/vz"
  - "-o canmount=on -o mountpoint=/etc/pve  {{ root_pool_dataset_path }}/etc-pve"
  - "-o canmount=on -o mountpoint=/{{ root_pool_name }}/data {{ root_pool_name }}/data"

###############################################################################
# [ Paths and Boot Loaders ]###################################################
# Mount point of the new system on the live CD (also the sshd chroot of phase 2)
live_cd_mountpoint: "/mnt"

# chroot command for tasks that run on the live system (phase 1)
chroot_cmd: "chroot {{ live_cd_mountpoint }}"

# EFI Boot Mountpoint
efi_boot_mountpoint: "/boot/efi"

# Path for EFI directory
efi_boot_path: "{{ efi_boot_mountpoint }}/EFI"

# Path for ZFSBootMenu
zfs_boot_menu_path: "{{ efi_boot_path }}/zfsbootmenu"

# ZFSBootMenu source repository and release (tag) to build
zfs_boot_menu_repo_url: "https://github.com/zbm-dev/zfsbootmenu"
zfs_boot_menu_version: "v3.1.0"

# zbm-luks-unlock hooks (LUKS unlock inside ZFSBootMenu), pinned to a commit
zbm_luks_unlock_base_url: "https://raw.githubusercontent.com/agorgl/zbm-luks-unlock"
zbm_luks_unlock_version: "6e5a6cf8e7430417d84431393fe6536bdc54658f"

# Path for rEFInd
refind_path: "{{ efi_boot_path }}/refind"

# rEFInd loader path on the ESP (backslashes) for startup.nsh and UEFI boot entries
refind_efi_pathname: 'EFI\refind\refind_x64.efi'

# Path for syslinux (legacy BIOS boot loader)
syslinux_path: "{{ efi_boot_mountpoint }}/syslinux"

# OS Prober is only needed on dual-boot configurations.
remove_os_prober: true

###############################################################################
# [ Packages ]#################################################################
# GRUB packages are held so they never get installed next to rEFInd/ZFSBootMenu
packages_to_mark_hold:
  - "grub-*"
  - "grub2"
  - "grub2-common"

# Package list for a minimal "standard" server installation
packages_standard:
  # --- SSH ---
  - task-ssh-server
  # --- core system integration ---
  - dbus
  - libpam-systemd
  - libnss-systemd
  - systemd-timesyncd
  - ca-certificates
  - gpg
  - gpg-agent
  - apparmor
  # --- admin / diagnostic utilities ---
  - bash-completion
  - pciutils
  - ethtool
  - lsof
  - htop
  - btop
  - needrestart
  - groff-base
  - man-db
  # --- networking utilities ---
  - wget
  - curl
  - netcat-traditional
  - traceroute
  - bind9-dnsutils
  # --- compression / archive ---
  - gzip
  - xz-utils
  - zstd
  - lz4
  - unzip
  # --- misc ---
  - media-types
  - unattended-upgrades

###############################################################################
# [ Misc ]#####################################################################
# Exists when the live system was booted in UEFI mode (otherwise legacy BIOS)
efi_firmware_path: "/sys/firmware/efi"

# sudoers include file for the ansible user in the new system
sudoers_include_file: "/etc/sudoers.d/99_sudo_include_file"

# Comma separated major device numbers to offer as "disk" devices when
# disk_devices is not given: 8=[SATA, SCSI], 179=[MMC], 259=[NVMe]
# (virtio disks like vda have a dynamic major number, specify them explicitly)
lsblk_device_types: "8,179,259"

# The RO column indicates if a device is read-only (value 1), the awk filters to value 0 - not read-only
lsblk_device_command: "lsblk -ndo name,mountpoint,ro --include {{ lsblk_device_types }} | awk '/0$/{print $1}'"

# This version shows a little more information during manual install selection
lsblk_device_detail_command: "lsblk -ndo name,size,mountpoint,ro --include {{ lsblk_device_types }} | awk '/0$/{printf \"%-8s %8s\\n\", $1,$2}'"
