---
galaxy_info:
  author: Simon Nibler
  description: |
    Debian 13 (Trixie) on ZFS root with ZFSBootMenu, rEFInd (UEFI) and syslinux
    (legacy BIOS), rules based on the number of devices. Optional LUKS or ZFS
    native encryption, Dropbear remote unlock, LVM partition. Base for Proxmox VE.

  platforms:
    - name: Debian
      versions:
        - trixie

  license: "license (BSD, MIT)"

  # ansible.builtin.mount_facts requires ansible-core 2.18
  min_ansible_version: "2.18"

  galaxy_tags:
    - zfs
    - debian
    - uefi
    - zfsbootmenu
    - dropbear
    - baremetal
    - proxmox

# Required collections: community.general, community.crypto, ansible.posix
dependencies: []
