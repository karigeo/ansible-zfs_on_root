---
###############################################################################
# Ansible Specific Settings
###############################################################################
# Don't log or display secrets (passphrase, passwords) when running the playbook
no_log_secrets: true
# Output additional debug messages
debug: false

###############################################################################
# User Settings
###############################################################################

# Temporary root password used during the build process.
# It is expired in final_setup (must be changed on first login).
default_root_password: "root"

###############################################################################
# Computer Configuration Settings
###############################################################################
# Default domain hosts will use if not defined in inventory file
domain_name: "localdomain"

# rEFInd boot menu timeout in seconds (rEFInd default is 20)
refind_boot_menu_timeout: "5"

# Specify rEFInd display resolution to use (width height)
# Default is "0 0", which sets system default resolution
# "max" tries to set the maximum possible resolution
refind_resolution: "0 0"

# Enable a rEFInd theme, cloned from refind_theme_repo into themes/<refind_theme_name>.
# The repository must contain a "theme.conf" (included from refind.conf) and the
# icon icons/os_proxmox.png used for the ZFSBootMenu entry.
refind_theming: true
refind_theme_name: refind-ambience
refind_theme_repo: https://github.com/karigeo/refind-ambience

# Directories (on the ESP) rEFInd should not scan, comma separated list.
# The ZFSBootMenu directory is excluded because a custom menu entry is added.
refind_no_scan_dirs: "{{ zfs_boot_menu_path[ efi_boot_mountpoint | length :] }}"

# Default locale (generated and set in /etc/default/locale)
default_locale: "en_US.UTF-8"
# Further locales that should be generated and present
locales_list:
  - "de_DE.UTF-8"

# Variables written to /etc/default/locale. Further keys can be added, e.g.
# LANGUAGE, LC_ADDRESS, LC_COLLATE, LC_CTYPE, LC_MEASUREMENT, LC_MESSAGES,
# LC_MONETARY, LC_NUMERIC, LC_PAPER, LC_TELEPHONE, LC_TIME (or LC_ALL).
apply_locale_settings:
  LANG: "{{ default_locale }}"

# Timezone of the new system
timezone_area: "Europe"
timezone_city: "Berlin"
localization_timezone: "{{ timezone_area }}/{{ timezone_city }}"

# Keyboard configuration written to /etc/default/keyboard
keyboard_model: "pc105"
keyboard_layout: "us"
keyboard_variant: ""
keyboard_options: ""
keyboard_backspace: "guess"

# Additional packages to install once the build has completed
# (on top of packages_standard in vars/main.yml)
additional_install_packages:
  - udisks2
  - net-tools
  - fwupd
  - pollinate

###############################################################################
# Network Configuration
###############################################################################
# Disable IPv6 if you do not use it.  The "disable_settings" will be applied to
# "conf_file"
ipv6:
  disable: true
  conf_file: "/etc/sysctl.d/99-sysctl.conf"
  disable_settings:
    - "net.ipv6.conf.all.disable_ipv6 = 1"
    - "net.ipv6.conf.default.disable_ipv6 = 1"
    - "net.ipv6.conf.lo.disable_ipv6 = 1"
  apply_cmd: "sysctl -p"

# Written to /etc/network/interfaces. As this is mainly intended to install
# Proxmox VE, the example uses a static IP on a VLAN aware bridge.
# address_type can be "manual", "static" or "dhcp"; network_address uses CIDR notation.
# DNS settings are written to /etc/resolv.conf (dns_search_domain "none" to omit it).
ipv4:
  interfaces:  # List of physical interfaces
    - name: eno1
      address_type: manual
      network_address: none
      gateway: none
    - name: eno2
      address_type: manual
      network_address: none
      gateway: none
  bridges:  # List of bridges, each with their bridge-ports (reference to interface.name)
    - name: vmbr0
      address_type: static
      network_address: "192.168.100.10/24"
      gateway: 192.168.100.1
      bridge_ports:
        - eno1
      vlan_aware: true
      bridge_vids: "2-4094"
    - name: vmbr1
      address_type: manual
      network_address: none
      gateway: none
      bridge_ports:
        - eno2
      vlan_aware: false
  dns_nameserver: 192.168.100.1
  dns_search_domain: my.do.main

###############################################################################
# Swap Partition Settings
###############################################################################
# Create Swap Partitions
enable_swap_partitions: true

# Swap partition size when one or two devices are used
single_or_mirror_swap_partition_size_mb: "4096"

# Swap partition size, per device, when three or more devices are used.
# They form an mdadm raid10, usable size in MB is: #devices * size_MB / 2
raidz_swap_partition_size_mb: "1024"

###############################################################################
# Disk Encryption Settings
###############################################################################
# Prompt for the encryption passphrase (LUKS or native) if it is not provided
# via the "passphrase" variable. If false, a missing passphrase is an error.
prompt_for_zfs_passphrase: true

# Specify whether to use LUKS or ZFS native encryption, see docs/zfs-encryption-settings.md
# The LVM partition (if enabled) is always encrypted with LUKS when encryption is used.
# "native" for ZFS native encryption
# "luks" for LUKS encryption
# "none" for no encryption
disk_encryption_type: luks

###############################################################################
# Root Pool Settings
###############################################################################
# Name of the root pool
root_pool_name: "rpool"

# Name of the dataset for the root filesystem
# {{ root_pool_name }}/ROOT/{{ root_dataset_name }}
root_dataset_name: "pve-1"

# Define ZFS default compression to enable
zfs_compression: "lz4"

# The root pool by default will consume all remaining disk space on the devices
# limited by the free space of the smallest device specified.  For example a
# mirror between a 512GB and 256GB device cannot be larger than the capacity of
# the smaller device.

# If you wish to limit the root pool size leaving unused space, you can define
# that here.  Specify how much space to allocate or NOT allocate per root pool
# partition per device.

# Examples:
# "+256G" will create partition 256Gib in size
# "-200M" will use all available space, minus 200Mib
# "0" (zero) use all available space
root_partition_size: "-200G"

###############################################################################
# LVM Pool Settings
###############################################################################
# Define if additional LVM Partition should be created:
create_lvm_partition: true

# Define LVM Pool partition size
# "+256G" will create partition 256Gib in size
# "-200M" will use all available space, minus 200Mib
# "0" (zero) use all available space

# LVM partition size when one or two devices are used
single_or_mirror_lvm_partition_size: "0"

# LVM partition size, per device, when three or more devices are used.
# They form an mdadm raid5, usable size is: (#devices - 1) * size
raidz_lvm_partition_size: "0"

# Volume group and (thin) logical volume created on the LVM partition
lvm_vg_name: pve
lvm_volume_name: data
lvm_volume_is_thin: true
lvm_volume_size: "99%VG"

###############################################################################
# ZFS Specific Adjustable Settings
###############################################################################

# Define the root pool type based on number of devices.
#  - If you want 3 devices to be a 3 way mirror change it, etc.
#  - 4, 6, 8, ... devices of type mirror form mirrored vdevs (pairs of disks).
#  - -  This is higher performance with redundancy and much faster resilver times
#  - -  than using any type of raidz.
#  - Raidz will be the default if something below is not defined.
#  - NOTE: A raidz2 requires 4 or more devices.
set_root_pool_type:
  1: ""         # single device
  2: "mirror"
  3: "raidz"
  4: "mirror"
  5: "raidz"
  6: "mirror"
  default: "raidz"

# Define ZFS ashift value to use
zfs_rpool_ashift: 12

# Enable ZFS Pool Trim Service after creating
# NOTE: false will create, just not enable by default.
zfs_pool_trim_systemd_service_enable: true

# Define ZFS Pool Trim Schedule (see systemd OnCalendar for valid options)
zfs_pool_trim_systemd_oncalendar: "weekly"

# Enable ZFS Pool Scrub Service after creating
# NOTE: false will create, just not enable by default.
zfs_pool_scrub_systemd_service_enable: true

# Define ZFS Pool Scrub Schedule (see systemd OnCalendar for valid options)
zfs_pool_scrub_systemd_oncalendar: "monthly"

###############################################################################
# SSH Settings
###############################################################################
# Applied in final_setup as drop-in /etc/ssh/sshd_config.d/50-zfs_on_root.conf
# (one "Key value" line per entry, overrides /etc/ssh/sshd_config).
update_sshd_settings: true
apply_sshd_settings:
  PasswordAuthentication: "no"
  PermitRootLogin: "prohibit-password"
  PubkeyAuthentication: "yes"
  UsePAM: "yes"  # Required for systemd-logind to SIGTERM the user ssh session (also requires packages libpam-systemd and dbus)

###############################################################################
# Dropbear Settings
###############################################################################
# Dropbear support adds a small SSH server (port 222) to the ZFSBootMenu image,
# to enter the encryption passphrase (LUKS or native) remotely. See docs/dropbear-settings.md
enable_dropbear_support: true
apply_dropbear_settings:
  # Physical network device to bring up for remote access
  remoteaccess_device: "{{ ipv4.interfaces[0].name }}"
  # IP configuration for ZFSBootMenu remote access (dracut ip= option):
  # "dhcp", "dhcp6", "on", "any", "auto6", "link6" or "static"
  remoteaccess_ip_config: "dhcp"
  # Remote access static IP address to connect to ZFSBootMenu
  # Only used with "static", not used for dhcp or dhcp6 automatic IP configuration
  remoteaccess_ip: "192.168.100.10"
  # Remote access subnet mask
  # Only used with "static", not used for dhcp or dhcp6 automatic IP configuration
  remoteaccess_netmask: "255.255.255.0"
  # Remote access gateway
  # Only used with "static"
  remoteaccess_gateway: "192.168.100.1"
  # List of public keys (authorized_keys lines) allowed to log in to dropbear.
  # Note that login to dropbear is "root" regardless of the key used.
  public_key_for_dropbear: ["ssh-ed25519 ABCDEFG user@machine"]
