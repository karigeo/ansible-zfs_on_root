---
# NOTE: Handlers run with play/host vars. A handler notified from a task in
# the chroot phase (ansible_port 8922) would run against the live system.
- name: "Restart sshd"
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Setupcon
  ansible.builtin.command:
    cmd: "setupcon -k"
  register: cmd_output
  changed_when: cmd_output.rc == 0
