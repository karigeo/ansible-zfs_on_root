---
# ###[ Restart timesyncd under Virtualbox ]######################################

- name: Restart timesyncd under Virtualbox Block
  when:
    - ansible_facts['os_family'] == "Debian"
    - virtual_box|default(false)|bool
  tags:
    - install-zfs-packages
    - always
  block:
    # ZFS package installs have failed due to "not yet valid" message. This usually happens
    # when time is not set correctly on the new system.  This happened often when virtualbox
    # snapshot images were used.  Restarting timesyncd service forces time to be updated.
    - name: Restarting timesync service under Virtualbox
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: restarted

    - name: Pause 10 seconds for time service to settle
      ansible.builtin.pause:
        seconds: 10

- name: Setup SSH Server to allow chroot Connection
  tags:
    - install-zfs-packages
  block:
    # Phase 2 of the role connects on port 8922 and lands directly in the chroot
    - name: Configure sshd to allow connecting directly inside the chroot
      notify: Restart sshd
      ansible.builtin.blockinfile:
        block: |
          Port 22
          Port 8922
          Match LocalPort 8922
            ChrootDirectory {{ live_cd_mountpoint }}
        path: /etc/ssh/sshd_config
        validate: /usr/sbin/sshd -T -C lport=22 -f %s

    - name: Force handlers to run
      ansible.builtin.meta: flush_handlers

# ###[ Change APT Sources on Live CD Environment ]##############################
- name: Update apt sources debian.sources
  tags:
    - install-zfs-packages
  block:
    - name: Remove default apt lists
      ansible.builtin.file:
        name: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list
        - /etc/apt/sources.list.d/debian.sources
    - name: Copy apt sources template in place
      ansible.builtin.template:
        src: debian.sources.j2
        dest: "/etc/apt/sources.list.d/debian.sources"
        owner: root
        group: root
        mode: "0644"

# ##[ Install Packages needed to get started ]##################################
- name: Install Packages needed to get started
  when:
    - ansible_facts['os_family'] == "Debian"
    - ansible_facts['distribution'] == "Debian"
  tags:
    - install-zfs-packages
  block:
    # Headers of the running kernel, not linux-headers-amd64: the live CD kernel is
    # usually older than the archive, and DKMS only builds for kernels with headers.
    - name: Install supporting packages (assumes Live CD Environment)
      ansible.builtin.apt:
        name: ['debootstrap', 'gdisk', "linux-headers-{{ ansible_facts['kernel'] }}", 'dosfstools', 'mdadm', 'cryptsetup', 'lshw']
        state: present
        update_cache: true
    - name: Install ZFS packages (assumes Live CD Environment)
      ansible.builtin.apt:
        name: ['zfs-dkms', 'zfsutils-linux']
        state: present
        update_cache: true
    - name: Load the ZFS kernel module
      community.general.modprobe:
        name: zfs
        state: present

- name: Generate ZFS hostid
  when:
    - ansible_facts['os_family'] == "Debian"
    - ansible_facts['distribution'] == "Debian"
  tags:
    - install-zfs-packages
  block:
    - name: Run command to generate ZFS hostid
      ansible.builtin.command:
        cmd: zgenhostid -f
      register: cmd_output
      changed_when: cmd_output.rc == 0

###############################################################################
