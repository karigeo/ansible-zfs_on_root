---
# [ Bootstrap new System ]#################################################
- name: Bootstrap New System Block
  when:
    - ansible_facts['nodename'] != "localhost"
  tags:
    - config_system
  block:
    - name: Mount run directory as tmpfs
      ansible.posix.mount:
        path: "{{ live_cd_mountpoint }}/run"
        src: tmpfs
        fstype: tmpfs
        state: ephemeral

    - name: Installing a minimal linux system
      ansible.builtin.command:
        "debootstrap --include lsb-release,python3,python3-apt,sudo,openssh-server,ca-certificates {{ distro_release }} {{ live_cd_mountpoint }}"
      args:
        creates: "{{ live_cd_mountpoint }}/etc/passwd"

    - name: Copy ZFS hostid
      ansible.builtin.copy:
        src: /etc/hostid
        remote_src: true
        dest: "{{ live_cd_mountpoint }}/etc/hostid"
        mode: "0644"

    - name: Copy keyfile for ZFS native encryption
      ansible.builtin.copy:
        src: "{{ zfs_native_keyfile }}"
        remote_src: true
        dest: "{{ live_cd_mountpoint }}{{ zfs_native_keyfile }}"
        owner: root
        group: root
        mode: "0600"
      when:
        - disk_encryption_type == "native"

    - name: Disable ZFS Device Node support
      ansible.builtin.command:
        "zfs set devices=off {{ root_pool_name }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0

# [ Start Configuring System ]#################################################
- name: Configure System Block
  when:
    - ansible_facts['nodename'] != "localhost"
  tags:
    - config_system
  block:
    - name: Copy hostname and hosts templates to the new system
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ live_cd_mountpoint }}/etc/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      with_items:
        - hostname
        - hosts
      loop_control:
        label: "{{ item }}.j2"

    - name: Confirm network interfaces are defined
      ansible.builtin.assert:
        that:
          - ipv4.interfaces is defined
          - ipv4.interfaces | length > 0
        fail_msg: "ERROR: ipv4.interfaces must list at least one physical interface, see defaults/main.yml"
        quiet: true

    - name: Copy network config file template
      ansible.builtin.template:
        src: interfaces.j2
        dest: "{{ live_cd_mountpoint }}/etc/network/interfaces"
        owner: root
        group: root
        mode: '0644'

    - name: Create resolv.conf file from template
      ansible.builtin.template:
        src: resolv.conf.j2
        dest: "{{ live_cd_mountpoint }}/etc/resolv.conf"
        owner: root
        group: root
        mode: '0644'

    - name: Remove default apt lists
      ansible.builtin.file:
        name: "{{ live_cd_mountpoint }}/etc/apt/sources.list"
        state: absent

    - name: Setup apt sources for Debian
      ansible.builtin.template:
        src: debian.sources.j2
        dest: "{{ live_cd_mountpoint }}/etc/apt/sources.list.d/debian.sources"
        owner: root
        group: root
        mode: '0644'

###############################################################################
# [ Setup chroot Environment ]#################################################
# Bind Virtual Filesystem from Live CD to New environment
- name: Setup chroot Environment Block
  when:
    - ansible_facts['nodename'] != "localhost"
  tags:
    - config_system
  block:
    - name: Refresh all mountpoints
      ansible.builtin.mount_facts:
        include_aggregate_mounts: true
        sources: all
    - name: Binding virtual file systems
      ansible.posix.mount:
        path: "{{ item.target }}"
        src: "{{ item.source }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.options }}"
        state: ephemeral
      loop:
        - { options: '',     fstype: 'proc',   source: '/proc', target: '{{ live_cd_mountpoint }}/proc'}
        - { options: '',     fstype: 'sysfs',  source: 'sys',   target: '{{ live_cd_mountpoint }}/sys'}
        - { options: 'bind', fstype: '',       source: '/dev',  target: '{{ live_cd_mountpoint }}/dev'}
        - { options: '',     fstype: 'devpts', source: 'pts',   target: '{{ live_cd_mountpoint }}/dev/pts'}
      when:
        - item.target not in ansible_facts['mount_points']

    # [ Apply APT-Cacher-NG Configuration ]####################################
    # If an APT caching proxy server is available set this up early to reduce
    # bandwidth requirements when downloading packages to install.

    - name: Apply Apt-Cacher-NG Configuration Update
      ansible.builtin.template:
        src: "apt_01proxy.j2"
        dest: "{{ live_cd_mountpoint }}/etc/apt/apt.conf.d/01proxy"
        owner: "root"
        group: "root"
        mode: "0644"
      when:
        - apt_http_proxy is defined or
          apt_https_proxy is defined

    # The chroot phase connects as "ansible" with the same UID and SSH key as on
    # the live system. The user gets no usable password ("*"): SSH key login and
    # passwordless sudo only, also on the installed system before final_setup.
    - name: Get UID of the ansible user on the live system
      ansible.builtin.getent:
        database: passwd
        key: ansible

    - name: Check if user ansible already exists in the chroot
      ansible.builtin.command:
        cmd: "{{ chroot_cmd }} getent passwd ansible"
      register: user_exists
      changed_when: false
      failed_when: false

    - name: Remove ansible user if already existing
      ansible.builtin.command:
        cmd: "{{ chroot_cmd }} userdel -r ansible"
      register: cmd_output
      changed_when: cmd_output.rc == 0
      when:
        - user_exists.rc == 0

    - name: Add ansible user to chroot environment
      ansible.builtin.command:
        cmd: "{{ chroot_cmd }} bash -c '{{ item }}'"
      register: cmd_output
      changed_when: cmd_output.rc == 0
      with_items:
        - "useradd -G sudo -u {{ getent_passwd['ansible'].1 }} -s /bin/bash --create-home --home-dir /home/ansible ansible"
        - "usermod -p \"*\" ansible"
        - "echo \"ansible ALL=(ALL) NOPASSWD:ALL\" > {{ sudoers_include_file }}"

    # Same host keys as the live system, so the chroot connection and later
    # dropbear (converted from these keys) are trusted by the controller
    - name: Copy SSH Server Keys into chroot
      ansible.builtin.copy:
        dest: "{{ live_cd_mountpoint }}/etc/ssh/{{ item.name }}"
        src: "/etc/ssh/{{ item.name }}"
        remote_src: true
        mode: "{{ item.permission }}"
        owner: root
        group: root
      loop:
        - { name: 'ssh_host_ecdsa_key', permission: '600' }
        - { name: 'ssh_host_ecdsa_key.pub', permission: '644' }
        - { name: 'ssh_host_ed25519_key', permission: '600' }
        - { name: 'ssh_host_ed25519_key.pub', permission: '644' }
        - { name: 'ssh_host_rsa_key', permission: '600' }
        - { name: 'ssh_host_rsa_key.pub', permission: '644' }

    - name: Copy SSH User Keys for User "ansible"
      ansible.builtin.copy:
        dest: "{{ live_cd_mountpoint }}/home/ansible/.ssh/"
        src: "/home/ansible/.ssh/{{ item.name }}"
        remote_src: true
        mode: "{{ item.permission }}"
        owner: ansible
        group: ansible
      loop:
        - { name: 'authorized_keys', permission: '600' }

###############################################################################
