---
# [ Dropbear in ZFSBootMenu ]##################################################
# Adds the dracut crypt-ssh module (dropbear) and network configuration to the
# ZFSBootMenu image, so the passphrase can be entered remotely via SSH (port 222).
- name: Configure System for Dropbear and Busybox to allow Remote Unlock Block
  when:
    - enable_dropbear_support | default(false) | bool
  tags:
    - install_dropbear
  block:
    # dropbear-bin only provides the binaries for the dracut crypt-ssh module in
    # the ZFSBootMenu image: no dropbear service on the host and no dropbear in
    # the host initramfs (unlike the dropbear / dropbear-initramfs packages)
    - name: Install Dracut-Network and Dropbear binaries
      ansible.builtin.apt:
        name: ['dracut-network', 'dropbear-bin', 'isc-dhcp-client']
        state: present
      when:
        - ansible_facts['os_family'] == "Debian"

    - name: Remove dracut-crypt-ssh directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/dracut-crypt-ssh/"
        - "/usr/lib/dracut/modules.d/60crypt-ssh/"

    - name: Create fresh temporary dracut-crypt-ssh directory
      ansible.builtin.file:
        path: "/tmp/dracut-crypt-ssh"
        state: directory
        mode: "0755"

    - name: Fetch dracut-crypt-ssh source from GIT
      ansible.builtin.git:
        clone: true
        repo: https://github.com/dracut-crypt-ssh/dracut-crypt-ssh.git
        dest: /tmp/dracut-crypt-ssh/
        force: true

    - name: Create dracut module 60crypt-ssh directory
      ansible.builtin.file:
        path: "/usr/lib/dracut/modules.d/60crypt-ssh"
        mode: "0755"
        state: directory

    - name: Copy dracut module 60crypt-ssh directory files
      ansible.builtin.copy:
        src: /tmp/dracut-crypt-ssh/modules/60crypt-ssh/
        dest: /usr/lib/dracut/modules.d/60crypt-ssh/
        remote_src: true
        mode: "0755"

    - name: Remove Makefile and helpers from dracut module 60crypt-ssh
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/usr/lib/dracut/modules.d/60crypt-ssh/Makefile"
        - "/usr/lib/dracut/modules.d/60crypt-ssh/helper/"

    # Comment out all lines containing: inst "$moddir"/helper/
    - name: Modify dracut module module-setup.sh
      ansible.builtin.replace:
        path: "/usr/lib/dracut/modules.d/60crypt-ssh/module-setup.sh"
        regexp: '(^.*inst "\$moddir"\/helper\/.*$)'
        replace: '#\1'

    # [ Setup Dracut Networking for Dropbear ]#################################
    - name: Find MAC address of device to listen on ({{ apply_dropbear_settings.remoteaccess_device }})
      ansible.builtin.set_fact:
        remoteaccess_macaddress: "{{ ansible_facts[apply_dropbear_settings.remoteaccess_device].macaddress }}"

    - name: Debug MAC address
      ansible.builtin.debug:
        msg: "Found MAC address: {{ remoteaccess_macaddress }} for device {{ apply_dropbear_settings.remoteaccess_device }}"
      when:
        debug | default(false)

    # rd.neednet=1 is not set on purpose: it makes the boot fail when no network
    # is available (e.g. laptop without its docking station)
    - name: Create file /etc/cmdline.d/dracut-network.conf for DHCP
      ansible.builtin.lineinfile:
        path: "/etc/cmdline.d/dracut-network.conf"
        regexp: '(^.*ip=.*$)'
        line: 'ifname=bootif:{{ remoteaccess_macaddress }} ip=bootif:{{ apply_dropbear_settings.remoteaccess_ip_config }} rd.break'
        create: true
        mode: "0644"
        state: present
        backup: false
      when:
        - apply_dropbear_settings.remoteaccess_ip_config in ['dhcp','on','any','dhcp6','auto6','link6']

    - name: Create file /etc/cmdline.d/dracut-network.conf for Static IP
      ansible.builtin.lineinfile:
        path: "/etc/cmdline.d/dracut-network.conf"
        regexp: '(^.*ip=.*$)'
        line: 'ifname=bootif:{{ remoteaccess_macaddress }} ip={{ apply_dropbear_settings.remoteaccess_ip }}::{{ apply_dropbear_settings.remoteaccess_gateway }}:{{ apply_dropbear_settings.remoteaccess_netmask }}:{{ host_name }}:bootif:none rd.break'
        create: true
        mode: "0644"
        state: present
        backup: false
      when:
        - apply_dropbear_settings.remoteaccess_ip_config == "static"

    - name: Config to publish hostname to DHCP server
      ansible.builtin.lineinfile:
        path: /usr/lib/dracut/modules.d/35network-legacy/dhclient.conf
        regexp: '(^.*send fqdn\.fqdn.*$)'
        line: "send fqdn.fqdn \"{{ host_name }}\";"
        state: present
        backup: false

    # [ Add Dropbear welcome message ]####################################
    - name: Copy dracut network banner to /etc/zfsbootmenu/dracut.conf.d/banner.txt
      ansible.builtin.template:
        src: dracut_banner.txt.j2
        dest: "/etc/zfsbootmenu/dracut.conf.d/banner.txt"
        owner: root
        group: root
        mode: '0644'

    - name: Add network banner to dropbear startup parameters
      ansible.builtin.replace:
        path: "/usr/lib/dracut/modules.d/60crypt-ssh/dropbear-start.sh"
        regexp: '(^.* /sbin/dropbear .*$)'
        replace: '\1 -b /etc/banner.txt'

    - name: Add network banner to dracut module setup
      ansible.builtin.replace:
        path: "/usr/lib/dracut/modules.d/60crypt-ssh/module-setup.sh"
        after: '(install\(\) {)'
        regexp: '(^}$)'
        replace: |
            #
            # Copy dropbear welcome banner message
              inst /etc/zfsbootmenu/dracut.conf.d/banner.txt /etc/banner.txt
            }

    # [ Host Keys ]############################################################
    # The dracut crypt-ssh module converts the OpenSSH host keys configured in
    # dracut_dropbear.conf, so dropbear presents the same host keys as sshd.
    - name: Create /etc/dropbear/ directory for authorized_keys
      ansible.builtin.file:
        path: "/etc/dropbear/"
        mode: "0755"
        state: directory

    # [ Add dracut dropbear config file ]######################################
    - name: Copy dracut dropbear config file to /etc/zfsbootmenu/dracut.conf.d/dropbear.conf
      ansible.builtin.template:
        src: dracut_dropbear.conf.j2
        dest: "/etc/zfsbootmenu/dracut.conf.d/dropbear.conf"
        owner: "root"
        group: "root"
        mode: "0644"

    # [ Add authorized keys ]#################################################
    - name: Remove dropbear authorized_keys file to recreate it
      ansible.builtin.file:
        path: "/etc/dropbear/authorized_keys"
        state: absent

    - name: Add authorized_keys to dropbear
      ansible.builtin.lineinfile:
        path: "/etc/dropbear/authorized_keys"
        line: "{{ item }}"
        create: true
        mode: "0644"
        state: present
      loop: "{{ apply_dropbear_settings.public_key_for_dropbear }}"

    - name: Regenerate ZBM image with dropbear
      ansible.builtin.command:
        cmd: "generate-zbm --debug"
      register: cmd_output
      changed_when: cmd_output.rc == 0

    - name: Debug show output of generate-zbm
      ansible.builtin.debug:
        var: cmd_output['stdout']
      when:
        debug | default(false)
