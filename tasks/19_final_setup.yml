---
###############################################################################
# [ Upgrade base system ]##################################################
- name: Upgrade Base System Block
  when:
    - ansible_facts['nodename'] != "localhost"
  tags:
    - final_setup
  block:
    - name: Update and Dist-Upgrade the system
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true
        autoclean: true
        autoremove: true
        update_cache: true
        install_recommends: true

    - name: Install minimal server package set (packages_standard)
      ansible.builtin.apt:
        autoclean: true
        autoremove: true
        install_recommends: true
        name: "{{ packages_standard }}"

###############################################################################
# [ Disable IPv6 Networking ]##################################################
- name: Disable IPv6 Networking Block
  when:
    - ipv6.disable | default(false) | bool
    - ansible_facts['nodename'] != "localhost"
  tags:
    - final_setup
    - disable_ipv6
  block:
    - name: Disable IPv6 Networking
      ansible.builtin.lineinfile:
        path: "{{ ipv6.conf_file }}"
        line: "{{ item }}"
        state: present
        create: true
        mode: "0644"
      loop: "{{ ipv6.disable_settings }}"
      loop_control:
        label: "{{ item }}"

    - name: Apply Updated IPv6 Setting
      ansible.builtin.command:
        cmd: "{{ ipv6.apply_cmd }} {{ ipv6.conf_file }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0

###############################################################################
# [ Apply SSHD Settings ]######################################################
# Debian's sshd_config includes /etc/ssh/sshd_config.d/*.conf first and the
# first value found wins, so these settings take precedence.
- name: Update SSHD Settings Block
  when:
    - update_sshd_settings | default(true) | bool
  tags:
    - final_setup
    - update_sshd_settings
  block:
    - name: Write SSHD settings drop-in file
      ansible.builtin.template:
        src: sshd_config_zfs_on_root.conf.j2
        dest: /etc/ssh/sshd_config.d/50-zfs_on_root.conf
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/sbin/sshd -t -f %s"
      register: update_sshd

    - name: Restart SSHD Server
      ansible.builtin.service:
        name: ssh
        state: restarted
      when: update_sshd.changed

###############################################################################
# [ Final Setup ]##############################################################
- name: Final Setup Block
  when:
    - ansible_facts['nodename'] != "localhost"
  tags:
    - final_setup
  block:
    - name: Install any remaining packages defined
      ansible.builtin.apt:
        pkg: "{{ additional_install_packages }}"
        state: present
        install_recommends: false
      when:
        - ansible_facts['os_family'] == "Debian"
        - additional_install_packages | default('', true) | length > 0

    # Set apt/dpkg to automagically snap the system datasets on install/remove
    - name: Copy apt 30pre-snap to /etc/apt/apt.conf.d/30pre-snap
      ansible.builtin.template:
        src: apt_30pre-snap.j2
        dest: /etc/apt/apt.conf.d/30pre-snap
        owner: root
        group: root
        mode: '0644'

    - name: Expire the root password
      ansible.builtin.command:
        cmd: "passwd --expire root"
      register: cmd_output
      changed_when: cmd_output.rc == 0

    - name: Disable ansible user password
      ansible.builtin.user:
        name: ansible
        password: '*'

    # [ Switch Log Compression to ZFS Compression ]############################
    - name: Locate Existing Log Files
      ansible.builtin.find:
        paths: /etc/logrotate.d
        patterns: "*"
      register: files_matched

    - name: Disable the log compression in each file so ZFS does the Log Compression
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: (^|[^#y])(compress)
        replace: '\1#\2'
      with_items: "{{ files_matched.files }}"
      loop_control:
        label: "{{ item.path }}"

    # [ Create System Snapshot Before Reboot ]#################################
    # If a base_install snapshot does not exist, create one
    - name: Create base_install snapshot
      ansible.builtin.shell:
        cmd:
          zfs get type {{ root_pool_dataset_path }}@base_install || zfs snapshot {{ root_pool_dataset_path }}@base_install
      args:
        executable: /bin/bash
      register: cmd_output
      changed_when: cmd_output.rc == 0

###############################################################################
