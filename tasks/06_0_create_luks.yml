---
###############################################################################
# ###[Create LUKS Containers if selected]######################################
# This block creates LUKS container(s) on each device, if LUKS encryption is selected.

- name: Create LUKS Containers
  when:
    - ansible_facts['nodename'] != "localhost"
    - disk_encryption_type == "luks"
  tags:
    - create_luks_containers
  block:
    - name: Create LUKS containers for root
      community.crypto.luks_device:
        device: "{{ item }}-part{{ root_partition }}"
        state: "opened"
        name: "{{ luks_root_mapper_names[idx] }}"
        cipher: "aes-xts-plain64"
        keysize: 512
        hash: "sha256"
        passphrase: "{{ passphrase }}"
      loop: "{{ disk_by_id }}"
      loop_control:
        index_var: idx
      no_log: "{{ no_log_secrets | default(true) | bool }}"
