---
# [ Unmount chroot ]###########################################################
- name: Unmount chroot Block
  when:
    - ansible_facts['nodename'] != "localhost"
  tags:
    - unmount_chroot
  block:
    # Issue trying to get everything unmounted cleanly
    # https://github.com/openzfs/openzfs-docs/issues/270
    # 1. Kill processes still running inside the chroot (e.g. sshd sessions of the
    #    port 8922 connection or a gpg-agent started by apt).
    # 2. Lazy unmount all non-ZFS mounts below the chroot, deepest first.
    # 3. Unmount the ZFS datasets.
    - name: Unmount chroot file systems
      ansible.builtin.shell: |
        for proc in /proc/[0-9]*; do
          if [ "$(readlink "${proc}/root" 2>/dev/null)" = "{{ live_cd_mountpoint }}" ]; then
            kill -9 "${proc#/proc/}" 2>/dev/null
          fi
        done
        sleep 1
        mount | awk '$3 ~ "^{{ live_cd_mountpoint }}/" && $5 != "zfs" {print $3}' | sort -r | xargs -r -n1 umount -lf
        zfs umount -a
        umount -R {{ live_cd_mountpoint }} 2>/dev/null
        umount -l {{ live_cd_mountpoint }} 2>/dev/null
        true
      args:
        executable: /bin/bash
      register: cmd_output
      changed_when: cmd_output.rc == 0

    - name: Export all ZFS Pools
      ansible.builtin.command:
        cmd: "zpool export -a"
      register: cmd_output
      changed_when: cmd_output.rc == 0
