---
# [ Prepare for First Reboot ]#################################################
- name: Prepare for First Reboot Block
  when:
    - ansible_facts['nodename'] != "localhost"
  tags:
    - first_boot_prep
  block:
    - name: Run apt dist-upgrade
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoclean: true
        autoremove: true
        purge: true

    - name: Add nicer PS1 USER prompt
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: >
          PS1="${debian_chroot:+($debian_chroot)}\[\e[38;5;207;1m\]\u\[\e[0;38;5;177m\]@\[\e[38;5;45m\]\h\[\e[0m\] \W/: "
        state: present
        backup: true
      with_items:
        - "/etc/bash.bashrc"
        - "/etc/skel/.bashrc"

    - name: Add nicer PS1 ROOT prompt
      ansible.builtin.lineinfile: # noqa yaml[line-length]
        path: "/root/.bashrc"
        line: >
          PS1="\[\e[38;5;197;1m\]\u\[\e[0;38;5;177m\]@\[\e[38;5;45m\]\h\[\e[0m\] \W/: "
        state: present
        backup: true

    - name: Allow read-only ZFS commands with no sudo password
      ansible.builtin.shell: # noqa command-instead-of-shell
        "{{ item }}"
      args:
        executable: /bin/bash
      register: cmd_output
      changed_when: cmd_output.rc == 0
      with_items:
        - "set -o pipefail; cat /etc/sudoers.d/zfs | sed -e 's/#//' > /etc/sudoers.d/zfsALLOW"

    # Required by ansible.builtin.expect
    - name: Install pexpect
      ansible.builtin.apt:
        name: python3-pexpect
        state: present

    - name: Run command to set default root password
      ansible.builtin.expect:
        command: "passwd"
        responses:
          (?i)password: "{{ default_root_password }}"
      no_log: "{{ no_log_secrets | default(true) | bool }}"

    - name: Run command to enable mount on default/root dataset
      ansible.builtin.command:
        cmd: "zfs set canmount=on {{ root_pool_dataset_path }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0

    # KVM/QEMU guest: install the guest agent and load the bochs video driver early
    - name: Block to prepare system as qemu guest
      when:
        ansible_facts.get('virtualization_role', '') == "guest" and ansible_facts.get('virtualization_type', '') == "kvm"
      block:
        - name: Install qemu-guest-agent
          ansible.builtin.apt:
            name: qemu-guest-agent
            state: present
            install_recommends: false
        - name: Enable qemu-guest-agent
          ansible.builtin.systemd_service:
            name: qemu-guest-agent
            enabled: true
        - name: Add bochs-drm driver module in initramfs
          ansible.builtin.lineinfile:
            path: /etc/initramfs-tools/modules
            create: true
            line: "bochs"
            owner: root
            group: root
            mode: '0644'
            state: present

    # mdadm arrays (ESP, swap) exist now - record them so they are assembled
    # with stable names at boot
    - name: Scan assembled mdadm arrays
      ansible.builtin.command:
        cmd: mdadm --detail --scan
      register: mdadm_scan
      changed_when: false
      when:
        - disk_by_id | length | int > 1

    - name: Record mdadm arrays in /etc/mdadm/mdadm.conf
      ansible.builtin.blockinfile:
        path: /etc/mdadm/mdadm.conf
        marker: "# {mark} ANSIBLE MANAGED ARRAYS"
        block: "{{ mdadm_scan.stdout }}"
      when:
        - disk_by_id | length | int > 1

    # Picks up mdadm.conf, crypttab and initramfs module changes made after the ZBM step
    - name: Update initramfs
      ansible.builtin.command:
        cmd: "update-initramfs -u -k all"
      register: cmd_output
      changed_when: cmd_output.rc == 0

    - name: Pause for a second to settle
      ansible.builtin.pause:
        seconds: 1
