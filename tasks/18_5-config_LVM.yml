---
# [ LVM Configuration ]########################################################
# The optional LVM partition becomes one volume group (lvm_vg_name).
# Multiple devices: the LVM partitions are joined into an mdadm array first
# (mirror for 2 devices, raid5 for 3 or more devices).
# With encryption ("luks" or "native") the volume group lives in a LUKS
# container that is unlocked with a keyfile stored on the (encrypted) root.

###############################################################################
# [ Create Multi Disk LVM Mirror or RAID ]#####################################
- name: Create Multi Disk LVM Mirror or RAID Block
  when:
    - ansible_nodename != "localhost"
    - create_lvm_partition | default(true) | bool
    - disk_by_id | length | int > 1
  tags:
    - config_lvm
  block:
    # The "-R" is needed to suppress the "Continue creating array?" prompt
    - name: Create mdadm array for multi-disk LVM
      ansible.builtin.command:
        cmd: >-
          mdadm --create {{ lvm_dev_name }} --verbose -R --metadata=1.2
          --level={{ (disk_by_id | length | int == 2) | ternary('mirror', 'raid5') }}
          --raid-devices={{ disk_by_id | length | int }} --homehost={{ host_name }}
          --name=lvm
          {{ disk_by_id | product(['-part' + lvm_partition]) | map('join') | join(' ') }}
        creates: "{{ lvm_dev_name }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0

    - name: Scan assembled mdadm arrays
      ansible.builtin.command:
        cmd: mdadm --detail --scan
      register: mdadm_scan
      changed_when: false

    - name: Record mdadm arrays in /etc/mdadm/mdadm.conf
      ansible.builtin.blockinfile:
        path: /etc/mdadm/mdadm.conf
        marker: "# {mark} ANSIBLE MANAGED ARRAYS"
        block: "{{ mdadm_scan.stdout }}"
      register: mdadm_conf

    - name: Update initramfs to include the new mdadm.conf
      ansible.builtin.command:
        cmd: update-initramfs -u -k all
      register: cmd_output
      changed_when: cmd_output.rc == 0
      when: mdadm_conf.changed

###############################################################################
# [ Unencrypted LVM Configuration ]############################################
- name: Unencrypted LVM Block
  when:
    - ansible_nodename != "localhost"
    - create_lvm_partition | default(true) | bool
    - disk_encryption_type == "none"
  tags:
    - config_lvm
  block:
    - name: Create LVM volume group on unencrypted LVM device
      community.general.lvg:
        vg: "{{ lvm_vg_name }}"
        pvs: "{{ lvm_device }}"

###############################################################################
# [ Encrypted LVM Configuration ]##############################################
- name: Encrypted LVM Block
  when:
    - ansible_nodename != "localhost"
    - create_lvm_partition | default(true) | bool
    - disk_encryption_type in ["luks", "native"]
  tags:
    - config_lvm
  block:
    - name: Make sure 'cryptsetup' is installed
      ansible.builtin.apt:
        name: cryptsetup
        state: present

    - name: Create LUKS container for LVM partition
      community.crypto.luks_device:
        device: "{{ lvm_device }}"
        state: "opened"
        name: "crypt_lvm"
        cipher: "aes-xts-plain64"
        keysize: 512
        hash: "sha256"
        passphrase: "{{ passphrase }}"
      no_log: "{{ no_log_secrets | default(true) | bool }}"

    - name: Create directory to hold the key files
      ansible.builtin.file:
        path: /etc/cryptsetup-keys.d/
        state: directory
        mode: "0700"

    - name: Create random key for LVM crypt container
      community.general.filesize:
        path: "/etc/cryptsetup-keys.d/{{ lvm_vg_name }}.key"
        source: /dev/urandom
        blocksize: 1024
        size: 4
        owner: root
        group: root
        mode: "0600"

    - name: Add new key to LVM crypt container
      community.crypto.luks_device:
        device: "{{ lvm_device }}"
        passphrase: "{{ passphrase }}"
        new_keyfile: "/etc/cryptsetup-keys.d/{{ lvm_vg_name }}.key"
      no_log: "{{ no_log_secrets | default(true) | bool }}"

    - name: Query UUID of LVM crypt container device
      ansible.builtin.command:
        cmd: "blkid -s UUID -o value {{ lvm_device }}"
      register: lvm_uuid
      changed_when: false

    - name: Validate exactly one UUID was returned
      ansible.builtin.fail:
        msg: "ERROR: Expected exactly one UUID for {{ lvm_device }}, got: {{ lvm_uuid.stdout_lines }}"
      when: lvm_uuid.stdout_lines | length != 1

    # Unlocked by systemd-cryptsetup after the root filesystem is mounted, so the
    # keyfile does not need to be part of the initramfs.
    - name: Add LVM crypt container to crypttab
      community.general.crypttab:
        name: "crypt_lvm"
        backing_device: "UUID={{ lvm_uuid.stdout }}"
        password: "/etc/cryptsetup-keys.d/{{ lvm_vg_name }}.key"
        opts: luks,discard
        state: present

    - name: Create LVM volume group on LVM crypt container
      community.general.lvg:
        vg: "{{ lvm_vg_name }}"
        pvs: "/dev/mapper/crypt_lvm"

###############################################################################
# [ Common Tasks of LVM Configuration ]########################################
- name: Run common tasks of LVM configuration
  when:
    - ansible_nodename != "localhost"
    - create_lvm_partition | default(true) | bool
  tags:
    - config_lvm
  block:
    - name: Create a LVM thin pool
      community.general.lvol:
        vg: "{{ lvm_vg_name }}"
        thinpool: "{{ lvm_volume_name }}"
        size: "{{ lvm_volume_size }}"
      when:
        - lvm_volume_is_thin | bool

    - name: Create a logical volume
      community.general.lvol:
        vg: "{{ lvm_vg_name }}"
        lv: "{{ lvm_volume_name }}"
        size: "{{ lvm_volume_size }}"
      when:
        - not lvm_volume_is_thin | bool
