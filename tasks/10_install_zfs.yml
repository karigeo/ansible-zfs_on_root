---
# [ Install ZFS and Kernel ]###################################################
- name: Install ZFS into chroot Block
  when:
    - ansible_facts['nodename'] != "localhost"
  tags:
    - install_zfs
  block:
    - name: Install DKMS to build the ZFS kernel module
      ansible.builtin.apt:
        name:
          - dkms
        install_recommends: false
      when:
        - ansible_facts['os_family'] == "Debian"

    - name: Ensure ZFS update rebuilds all initramfs
      ansible.builtin.copy:
        dest: /etc/dkms/zfs.conf
        content: REMAKE_INITRD=yes
        mode: '0644'

    - name: Install further required Software and ZFS into chroot
      ansible.builtin.apt:
        name:
          - linux-headers-generic
          - linux-image-generic
          - wget
          - nano
          - vim
          - bridge-utils
          - lvm2
          - zfsutils-linux
          - zfs-zed
          - zfs-initramfs
          - zfs-dkms
        install_recommends: false
      when:
        - ansible_facts['os_family'] == "Debian"

    # The "old" kernel links mess up zfsbootmenu generation, so remove them
    # Don't need them for an initial install anyway
    - name: Clean up old kernel links
      ansible.builtin.file:
        state: absent
        path: "{{ item }}"
      loop:
        - "/boot/vmlinuz.old"
        - "/boot/initrd.img.old"

    - name: Ensure cachefile exists
      ansible.builtin.command:
        cmd: "zpool set cachefile=/etc/zfs/zpool.cache {{ root_pool_name }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0

    - name: Enable ZFS import (cachefile) and mount services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
      loop:
        - zfs.target
        - zfs-import-cache
        - zfs-mount
        - zfs-import.target
