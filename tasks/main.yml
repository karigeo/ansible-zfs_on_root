---
###############################################################################
# Installs Debian 13 on ZFS root from a Debian Live CD. DESTRUCTIVE: all
# partitions on "disk_devices" are erased.
#
# Usage:
#   ansible-playbook -i inventory.yml playbook.yml -l <host> --tags bootstrap \
#     --extra-vars='{disk_devices: [sda, sdb], host_name: "mynewpc", passphrase: "mys3cret"}'
#
# The role only runs when "bootstrap" or one of its step tags (zfs_on_root_tags
# in vars/main.yml) is requested with --tags, so it is safe to have it in a
# site playbook. The includes are tagged "always" and gated with that "when";
# the included tasks get the "bootstrap" tag (apply) and are selected by their
# own tags otherwise, so single steps and --skip-tags work.
#
# Devices like "sda" are converted to /dev/disk/by-id (or /dev/disk/by-path)
# references. If "disk_devices" or "host_name" is not specified, you will be
# prompted for it.
#
# Phases:
#   1. Live CD environment: checks, partitioning, encryption, pool, debootstrap
#   2. chroot: tasks connect to the live system's sshd on port 8922, which is
#      chrooted into live_cd_mountpoint (see 03_install_zfs_packages.yml)
#   3. Reboot into the new system and finalize it
###############################################################################

# [ Load up the secret files ]#####################################################################
- name: Include Secret Files
  ansible.builtin.include_vars: "{{ item }}"
  tags: ["always"]
  when: ansible_run_tags | intersect(zfs_on_root_tags) | length > 0
  loop:
    - secrets/main.yml
  no_log: "{{ no_log_secrets | default(true) }}"

- name: Include Task Files to Configure and Setup Live CD Environment and Base System
  ansible.builtin.include_tasks:
    file: "{{ task_names }}"
    apply:
      tags: ["bootstrap"]
  tags: ["always"]
  when: ansible_run_tags | intersect(zfs_on_root_tags) | length > 0
  loop:
    - 01_test_virtualbox.yml
    - 01_basic_checks.yml
    - 02_confirm_defaults.yml
    - 03_install_zfs_packages.yml
    - 04_clear_partition_tables.yml
    - 05_create_partitions.yml
    - 06_0_create_luks.yml
    - 06_create_pools.yml
    - 07_create_filesystems.yml
    - 08_create_datasets.yml
    - 09_0_config_system.yml
  loop_control:
    label: "{{ task_names }}"
    loop_var: task_names

- name: Include Task Files to Configure new System in chroot
  vars:
    ansible_port: 8922
  ansible.builtin.include_tasks:
    file: "{{ task_names }}"
    apply:
      tags: ["bootstrap"]
  tags: ["always"]
  when: ansible_run_tags | intersect(zfs_on_root_tags) | length > 0
  loop:
    - 09_1_config_system.yml
    - 10_install_zfs.yml
    - 11_config_boot_filesystem.yml
    - 12_3-install_refind.yml
    - 12_4-install_syslinux.yml
    - 12_5-install_zfsbootmenu.yml
    - 12_6-config_swap.yml
    - 12_7-system_tweaks.yml
    - 13_first_boot_prep.yml
  loop_control:
    label: "{{ task_names }}"
    loop_var: task_names

- name: Include Task Files to Reboot, Reconnect and Finalize new System Config
  ansible.builtin.include_tasks:
    file: "{{ task_names }}"
    apply:
      tags: ["bootstrap"]
  tags: ["always"]
  when: ansible_run_tags | intersect(zfs_on_root_tags) | length > 0
  loop:
    - 15_unmount_chroot.yml
    - 16_restart_remote.yml
    - 17_localization.yml
    - 18_enable_dropbear.yml
    - 18_5-config_LVM.yml
    - 19_final_setup.yml
    - 20_restart_remote_final.yml
  loop_control:
    label: "{{ task_names }}"
    loop_var: task_names
