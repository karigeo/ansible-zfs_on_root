---
###############################################################################
# ###[ Keyfile for ZFS Native Encryption ]#####################################
- name: Create keyfile for ZFS native encryption
  when:
    - disk_encryption_type == "native"
    - ansible_nodename != "localhost"
  tags:
    - create_pools
  ansible.builtin.copy:
    dest: "{{ zfs_native_keyfile }}"
    content: "{{ passphrase }}"
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ no_log_secrets | default(true) | bool }}"

###############################################################################
# ###[ Create Standard ZFS Root Pool ]#########################################
# Single device, mirror, raidz or raidz2 - all devices form one vdev.
# Only 4+ devices of type "mirror" are handled by the mirrored vdevs block below.
- name: Create Standard ZFS Root Pool Block
  when:
    - not (root_pool_type == "mirror" and disk_by_id | length | int >= 4)
    - ansible_nodename != "localhost"
  tags:
    - create_pools
  block:
    - name: Debug Create ZFS Root Pool
      ansible.builtin.debug:
        msg: "zpool create -f {{ root_pool_create_params }}"
      when:
        - debug | default(false)

    - name: Create Standard ZFS Root Pool
      ansible.builtin.command:
        cmd: "zpool create -f {{ root_pool_create_params }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0

###############################################################################
# ###[ Create Mirror VDEVs ZFS Root Pool ]#####################################
# High performance root pool built from mirrored pairs of devices (vdevs).
# Requires 4 or more (even number of) devices and root_pool_type "mirror".
- name: Create Mirrored vdevs Based Root Pool Block
  when:
    - root_pool_type == "mirror"
    - disk_by_id | length | int >= 4
    - ansible_nodename != "localhost"
  tags:
    - create_pools
  block:
    - name: Debug Create Mirrored vdev ZFS Root Pool
      ansible.builtin.debug:
        msg: "zpool create -f {{ root_pool_create_options }} {{ root_pool_name }} mirror {{ root_pool_devices[0] }} {{ root_pool_devices[1] }}"
      when:
        - debug | default(false)

    - name: Create Mirrored vdev ZFS Root Pool with the first device pair
      ansible.builtin.command:
        cmd: "zpool create -f {{ root_pool_create_options }} {{ root_pool_name }} mirror {{ root_pool_devices[0] }} {{ root_pool_devices[1] }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0

    - name: Attach remaining mirrored vdev pairs to Root Pool
      ansible.builtin.command:
        cmd: "zpool add -f {{ root_pool_name }} mirror {{ root_pool_devices[item] }} {{ root_pool_devices[item + 1] }}"
      loop: "{{ range(2, root_pool_devices | length, 2) | list }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0
