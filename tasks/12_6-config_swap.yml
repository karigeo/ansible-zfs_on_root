---
# [ Swap Configuration ]#######################################################
# Single device: swap lives directly on the swap partition.
# Multiple devices: the swap partitions are joined into an mdadm array
# (mirror for 2 devices, raid10 for 3 or more devices).
# With encryption ("luks" or "native") swap gets a new random key on every
# boot (plain dm-crypt configured in /etc/crypttab).

###############################################################################
# [ Create Multi Disk Swap mdadm Array ]#######################################
- name: Create Multi Disk Swap mdadm Array Block
  when:
    - ansible_facts['nodename'] != "localhost"
    - enable_swap_partitions | default(true) | bool
    - disk_by_id | length | int > 1
  tags:
    - config_swap
  block:
    - name: Wipe mdadm superblock from swap partitions
      ansible.builtin.command:
        cmd: "mdadm --zero-superblock --force {{ item }}-part{{ swap_partition }}"
        creates: "{{ swap_dev_name }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0
      failed_when: false
      loop: "{{ disk_by_id }}"

    # The "-R" is needed to suppress the "Continue creating array?" prompt
    - name: Create mdadm array for multi-disk swap
      ansible.builtin.command:
        cmd: >-
          mdadm --create {{ swap_dev_name }} --verbose -R --metadata=1.2
          --level={{ (disk_by_id | length | int == 2) | ternary('mirror', 'raid10') }}
          --raid-devices={{ disk_by_id | length | int }} --homehost={{ host_name }}
          --name=swap --assume-clean
          {{ disk_by_id | product(['-part' + swap_partition]) | map('join') | join(' ') }}
        creates: "{{ swap_dev_name }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0

###############################################################################
# [ Unencrypted Swap ]#########################################################
- name: Unencrypted Swap Block
  when:
    - ansible_facts['nodename'] != "localhost"
    - enable_swap_partitions | default(true) | bool
    - disk_encryption_type == "none"
  tags:
    - config_swap
  block:
    - name: Check for an existing swap signature
      ansible.builtin.command:
        cmd: "blkid -s TYPE -o value {{ swap_device }}"
      register: swap_type
      changed_when: false
      failed_when: false

    - name: Create swap filesystem
      ansible.builtin.command:
        cmd: "mkswap -f {{ swap_device }}"
      register: cmd_output
      changed_when: cmd_output.rc == 0
      when: swap_type.stdout != "swap"

    - name: Get swap UUID
      ansible.builtin.command:
        cmd: "blkid -s UUID -o value {{ swap_device }}"
      register: swap_uuid
      changed_when: false
      failed_when: swap_uuid.stdout | length == 0

    - name: Add swap to /etc/fstab
      ansible.posix.mount:
        path: none
        src: "UUID={{ swap_uuid.stdout }}"
        fstype: swap
        opts: discard
        state: present

###############################################################################
# [ Encrypted Swap ]###########################################################
- name: Encrypted Swap Block
  when:
    - ansible_facts['nodename'] != "localhost"
    - enable_swap_partitions | default(true) | bool
    - disk_encryption_type in ["luks", "native"]
  tags:
    - config_swap
  block:
    - name: Add encrypted swap device to /etc/crypttab
      community.general.crypttab:
        name: crypt_swap
        backing_device: "{{ swap_device }}"
        password: /dev/urandom
        opts: swap,cipher=aes-xts-plain64:sha256,size=512
        state: present

    - name: Add encrypted swap to /etc/fstab
      ansible.posix.mount:
        path: none
        src: /dev/mapper/crypt_swap
        fstype: swap
        opts: defaults
        state: present
