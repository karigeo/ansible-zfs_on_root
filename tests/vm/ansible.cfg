[defaults]
retry_files_enabled = False
any_errors_fatal = True
host_key_checking = False
timeout = 60
callback_result_format = yaml

[ssh_connection]
pipelining = True
# Every case reinstalls the VM (new host keys), so never remember them
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=8
retries = 3
